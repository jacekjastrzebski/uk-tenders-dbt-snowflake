version: 2

models:
  - name: dim_dates
    description: >
      Calendar, one row per day between the vars dim_dates_start and
      dim_dates_end (dbt_project.yml); UK financial year April to March.
      In Power BI: mark as the date table on calendar_date and turn off auto date/time.
    columns:
      - name: calendar_date
        description: The day; key that fact date columns join to.
        data_tests: [unique, not_null]
      - name: calendar_year
        description: Calendar year, e.g. 2026.
      - name: month_number
        description: 1-12; sort month_name by this column in Power BI.
      - name: month_name
        description: January-December.
      - name: month_start
        description: First day of the month; continuous axis for monthly trends.
      - name: year_month
        description: e.g. 2026-10, a label for monthly trends.
      - name: week_start
        description: Monday of the week.
      - name: financial_year
        description: UK financial year, e.g. 2026/27 (1 April 2026 to 31 March 2027); sorts correctly as text.
      - name: financial_month_number
        description: Month within the financial year, April = 1 to March = 12; sort months by this in financial-year visuals.

  - name: dim_cpv_divisions
    description: Sectors, one row per CPV division (first 2 digits of a CPV code), plus "Unknown sector" (UNKNOWN) for notices without a CPV code.
    columns:
      - name: cpv_division
        description: e.g. 72; facts join on LEFT(cpv_code, 2), or UNKNOWN when there is no CPV code.
        data_tests: [unique, not_null]
      - name: division_name
        description: Official CPV name, e.g. IT services.
      - name: is_digital_and_data
        description: True for divisions 48 (software) and 72 (IT services).
      - name: market
        description: One of 9 markets from the cpv_divisions seed (e.g. Digital and data, Health and social care), or Unknown; for slicers.

  - name: dim_buyers
    description: Buyers, one row per organisation grouped by normalised name (macro normalise_org_name).
    columns:
      - name: buyer_key
        description: Normalised buyer name; facts join on the same macro applied to their buyer name.
        data_tests: [unique, not_null]
      - name: buyer_name
        description: Name from the buyer's most recent notice; never an unusable name like "[]" (ADR 0025).
      - name: buyer_ids
        description: All organisation IDs seen for this buyer, comma-separated, for tracing back to notices.

  - name: dim_suppliers
    description: >
      Suppliers, one row per organisation grouped by normalised name (macro
      normalise_org_name: lot numbers removed). Names are kept, including the
      few that may be sole traders' trading names (ADR 0021).
    columns:
      - name: supplier_key
        description: Normalised supplier name; facts join on the same macro applied to their supplier name.
        data_tests: [unique, not_null]
      - name: supplier_name
        description: Name from the supplier's most recent notice, lot numbers removed; never an unusable name like "N/A" (ADR 0025).
      - name: supplier_ids
        description: All organisation IDs seen for this supplier, comma-separated.
      - name: is_withheld
        description: True when the buyer withheld the supplier's name (Procurement Act section 94); leave out of supplier rankings.

  - name: fct_award_suppliers
    description: >
      One row per supplier on an award (deduplicated across notices); award
      value in GBP split equally between suppliers. Excludes dynamic-market
      admissions, cancelled and unsuccessful awards. Headline totals use is_in_headline.
    columns:
      - name: award_supplier_key
        data_tests: [unique, not_null]
      - name: award_date
        description: UK date of the award (see date_source).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: calendar_date
      - name: buyer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_buyers')
                field: buyer_key
      - name: supplier_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_suppliers')
                field: supplier_key
      - name: cpv_division
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_cpv_divisions')
                field: cpv_division
      - name: allocated_value_gbp
        description: This supplier's equal share of the award value; sum this.
      - name: is_old_regime
        description: An award under the rules before the Procurement Act (its notices have no notice type).
      - name: is_in_headline
        description: Counts in the headline totals - not a framework set-up, not a large value, not under the old rules, value known.
      - name: competition
        description: How the award was made, from its latest notice - Competed (open, selective or limited), Direct award (direct award or below threshold without competition), or Not stated (ADR 0035).
        data_tests:
          - accepted_values:
              arguments:
                values: ['Competed', 'Direct award', 'Not stated']
      - name: supplier_scale
        description: The size the supplier declares on the award's latest notice - SME, Large, or Not stated.
        data_tests:
          - accepted_values:
              arguments:
                values: ['SME', 'Large', 'Not stated']

  - name: fct_procurements
    description: >
      One row per Procurement Act tender (a procurement with a UK4 notice), for
      "What's open to bid?" and "How long to award?". Dates are UK dates of the
      notices' publication. Open = closing_date from today, no award_published_date,
      not is_cancelled (worked out in Power BI).
    columns:
      - name: ocid
        data_tests: [unique, not_null]
      - name: buyer_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_buyers')
                field: buyer_key
      - name: cpv_division
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_cpv_divisions')
                field: cpv_division
      - name: tender_published_date
        description: First tender notice (UK4).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: calendar_date
      - name: closing_date
        description: From the latest tender notice; the bid deadline, or the expression-of-interest deadline in two-stage procedures.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: calendar_date
      - name: award_published_date
        description: First award notice (UK6), else the first contract notice (UK7) for contracts that skip it.
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: calendar_date
      - name: contract_published_date
        description: First contract details notice (UK7).
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: calendar_date
      - name: days_tender_to_award
        description: Days from tender to award notice; null when unknown or notices were published out of order.
      - name: days_award_to_contract
        description: Days from the award notice (UK6) to the contract notice (UK7); null without an award notice, or when published out of order.
      - name: is_cancelled
        description: A termination notice (UK12) and no award.
      - name: tender_notice_url
        description: Link to the latest tender notice (UK4) on Find a Tender.
        data_tests: [not_null]
      - name: tender_value_gbp
        description: Estimated value incl. VAT from the latest tender notice, GBP only; never add up, framework values are spending caps (ADR 0035).
      - name: is_framework
        description: The tender sets up a framework agreement; its value is a cap, not spend.
      - name: is_suitable_for_sme
        description: At least one lot is marked suitable for SMEs by the buyer.

  - name: dim_data_freshness
    description: One row with the time of the latest load from the API, for the report's "Data loaded" card.
    columns:
      - name: last_loaded_at
        description: Latest load time in staging, UK local time.
        data_tests: [not_null]
