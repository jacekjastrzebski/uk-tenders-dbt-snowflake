# Deploy the loader to Snowflake when a change to it merges to main.
# Called by ci.yml after its checks pass on a push to main, so a failing build never deploys.
# Each step runs only if its own file changed in the push:
#   ingestion/load_find_a_tender.py  -> upload it to the code stage
#   02_ingest_procedure.sql          -> recreate the stored procedure
#   03_ingest_task.sql               -> recreate the scheduled tasks
#   04_failure_alert.sql             -> recreate the failure alert
#   dbt/** or snowflake/dbt/profiles.yml -> deploy a new version of the dbt project object (ADR 0009)
#   snowflake/dbt/01_run_dbt_task.sql    -> recreate the dbt task and its failure alert
# A manual run (workflow_dispatch) deploys everything.
# One-off setup (00 and 01 in snowflake/native_ingestion/, snowflake/dbt/00_dbt_setup.sql) stays
# manual: it needs ACCOUNTADMIN. This workflow deploys as TENDER_DEPLOY, with role TENDER_INGEST
# for the loader and TENDER_TRANSFORM for dbt.
name: Deploy

on:
  workflow_call:             # from ci.yml, after the checks pass (github.event is CI's push)
  workflow_dispatch:         # manual run from the Actions tab (main only)

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: deploy          # never run two deploys at once
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history, to compare with the commit before the push
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Find changed files
        id: changed
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" != workflow_dispatch ]; then
            changed_files=$(git diff --name-only "$BEFORE" "$AFTER")
          fi
          deploy_if_changed() {   # $1 = output name, $2 = file, matched as a regex (dbt/.* = the folder)
            if [ "$EVENT" = workflow_dispatch ] || grep -qx "$2" <<< "$changed_files"; then
              echo "$1=true" >> "$GITHUB_OUTPUT"
              echo "any=true" >> "$GITHUB_OUTPUT"
              echo "deploy $2"
            fi
          }
          deploy_if_changed loader    ingestion/load_find_a_tender.py
          deploy_if_changed procedure snowflake/native_ingestion/02_ingest_procedure.sql
          deploy_if_changed tasks     snowflake/native_ingestion/03_ingest_task.sql
          deploy_if_changed alert     snowflake/native_ingestion/04_failure_alert.sql
          deploy_if_changed dbt       'dbt/.*'
          deploy_if_changed dbt       snowflake/dbt/profiles.yml
          deploy_if_changed dbt_task  snowflake/dbt/01_run_dbt_task.sql

      - name: Write Snowflake connection
        if: steps.changed.outputs.any == 'true'   # CI calls this on every push; most change nothing here
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077   # key and config readable by this user only
          mkdir -p ~/.snowflake
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/key.p8
          cat > ~/.snowflake/connections.toml <<TOML
          [tender]
          account = "$SNOWFLAKE_ACCOUNT"
          user = "$SNOWFLAKE_USER"
          authenticator = "SNOWFLAKE_JWT"
          private_key_file = "$HOME/.snowflake/key.p8"
          role = "TENDER_INGEST"
          database = "TENDER_DB"
          warehouse = "TENDER_WH"
          TOML

      - name: Upload loader
        if: steps.changed.outputs.loader == 'true'
        run: uvx --from snowflake-cli==3.28.0 snow stage copy ingestion/load_find_a_tender.py @TENDER_DB.RAW.CODE_STAGE --overwrite -c tender

      - name: Create procedure
        if: steps.changed.outputs.procedure == 'true'
        run: uvx --from snowflake-cli==3.28.0 snow sql -f snowflake/native_ingestion/02_ingest_procedure.sql -c tender

      - name: Create tasks
        if: steps.changed.outputs.tasks == 'true'
        run: uvx --from snowflake-cli==3.28.0 snow sql -f snowflake/native_ingestion/03_ingest_task.sql -c tender

      - name: Create failure alert
        if: steps.changed.outputs.alert == 'true'
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: uvx --from snowflake-cli==3.28.0 snow sql -f snowflake/native_ingestion/04_failure_alert.sql -D "alert_email=$ALERT_EMAIL" -c tender

      # New version of the project object; without --force, its run history is kept.
      # Pin dbt: the account default (1.9.4) can't compile the project. Use the newest
      # 1.x that SYSTEM$SUPPORTED_DBT_VERSIONS() lists, close to the local dbt-core.
      - name: Deploy dbt project
        if: steps.changed.outputs.dbt == 'true'
        run: uvx --from snowflake-cli==3.28.0 snow dbt deploy UK_TENDERS --source dbt --profiles-dir snowflake/dbt --dbt-version 1.12.3 --database TENDER_DB --schema DBT --role TENDER_TRANSFORM -c tender

      - name: Create dbt task and alert
        if: steps.changed.outputs.dbt_task == 'true'
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: uvx --from snowflake-cli==3.28.0 snow sql -f snowflake/dbt/01_run_dbt_task.sql -D "alert_email=$ALERT_EMAIL" -c tender
