# Type check and test every pull request and every push to main, and parse (and on
# dbt pull requests build) the dbt project;
# on main, deploy to Snowflake (deploy.yml) only after the checks pass
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --locked   # Python version comes from .python-version

      - name: File checks (pre-commit)
        run: uv run pre-commit run --all-files
        env:
          SKIP: mypy,pytest   # run as separate steps below

      - name: Type check (strict)
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  # dbt: parse everything; on pull requests that change dbt/, also build every model and
  # run every test into temporary CI_PR_<number> schemas, dropped afterwards (ADR 0030).
  # It signs in as TENDER_CI, which can't touch the prod schemas (snowflake/setup/06_ci_role.sql)
  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: dbt-${{ github.event.pull_request.number || github.sha }}
      cancel-in-progress: true
    env:
      DBT_PROFILES_DIR: .github/dbt
      DBT_CI_SCHEMA: CI_PR_${{ github.event.pull_request.number }}
      SNOWFLAKE_USER: TENDER_CI
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # to compare with the base branch
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dbt
        run: uv sync --locked --group dbt

      - name: Parse
        run: uv run dbt parse --project-dir dbt

      - name: Did dbt change?
        id: changed
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HAS_SECRETS: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY != '' }}
        run: |
          if git diff --name-only "$BASE" HEAD | grep -q '^dbt/'; then
            if [ "$HAS_SECRETS" = true ]; then
              echo "build=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice::dbt changed, but no Snowflake secrets (pull request from a fork): build skipped"
            fi
          fi

      - name: Snowflake key
        if: steps.changed.outputs.build == 'true'
        env:
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_CI_PRIVATE_KEY }}
        run: |
          umask 077   # readable by this user only
          mkdir -p ~/.snowflake
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/key.p8
          echo "SNOWFLAKE_PRIVATE_KEY_PATH=$HOME/.snowflake/key.p8" >> "$GITHUB_ENV"

      - name: Build and test into CI_PR schemas
        if: steps.changed.outputs.build == 'true'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: uv run dbt build --project-dir dbt

      - name: Drop CI_PR schemas
        if: always() && steps.changed.outputs.build == 'true'
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
        run: |
          uv run dbt run-operation drop_ci_schemas --project-dir dbt --args "{prefix: $DBT_CI_SCHEMA}"

  deploy:
    needs: [checks, dbt]   # deploy only what passed the checks
    permissions:
      contents: write      # to move the deployed tag (deploy.yml)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
