# Type check and test every pull request and every push to main
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10

      - name: Install dependencies
        run: uv sync --locked   # Python version comes from .python-version

      - name: Type check (strict)
        run: uv run mypy

      - name: Tests
        run: uv run pytest
