# Type check and test every pull request and every push to main;
# on main, deploy to Snowflake (deploy.yml) only after the checks pass
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --locked   # Python version comes from .python-version

      - name: File checks (pre-commit)
        run: uv run pre-commit run --all-files
        env:
          SKIP: mypy,pytest   # run as separate steps below

      - name: Type check (strict)
        run: uv run mypy

      - name: Tests
        run: uv run pytest

  deploy:
    needs: checks   # deploy only what passed the checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    secrets: inherit
