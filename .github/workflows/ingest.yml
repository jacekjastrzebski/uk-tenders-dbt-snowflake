# Load Find a Tender releases into Snowflake every 3 hours.
# Runs on GitHub Actions because Snowflake trial accounts block calls to external
# APIs (see snowflake/native_ingestion/ for the paid-account version), and an
# orchestrator such as Airflow would be more infrastructure than one job needs.
name: Ingest

on:
  schedule:
    - cron: "17 */3 * * *"  # 00:17, 03:17, ... UTC (off the busy hour mark); runs only from main
  workflow_dispatch:         # manual run from the Actions tab (main only)

permissions:
  contents: read

concurrency:
  group: ingest            # never run two loads at once
  cancel-in-progress: false

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0

      - name: Install dependencies
        run: uv sync --locked --no-dev

      - name: Write Snowflake connection
        env:
          SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
          SNOWFLAKE_PRIVATE_KEY: ${{ secrets.SNOWFLAKE_PRIVATE_KEY }}
        run: |
          umask 077   # key and config readable by this user only
          mkdir -p ~/.snowflake
          printf '%s\n' "$SNOWFLAKE_PRIVATE_KEY" > ~/.snowflake/key.p8
          cat > ~/.snowflake/connections.toml <<TOML
          [tender]
          account = "$SNOWFLAKE_ACCOUNT"
          user = "$SNOWFLAKE_USER"
          authenticator = "SNOWFLAKE_JWT"
          private_key_file = "$HOME/.snowflake/key.p8"
          role = "SYSADMIN"
          database = "TENDER_DB"
          warehouse = "TENDER_WH"
          TOML

      - name: Load releases
        run: uv run ingestion/load_find_a_tender.py
